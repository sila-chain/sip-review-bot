name: Latest SIP Review Bot Sync

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  sync:
    if: github.head_ref == 'sila/sip-review-bot-latest-20260911'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Apply exact upstream crash logging change
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/action.ts')
          s = p.read_text()
          old = 'run().catch(() => process.exit(2));'
          new = '''run().catch((e) => {\n    core.setFailed(e instanceof Error ? e : String(e));\n    process.exit(2);\n});'''
          if old not in s:
              raise SystemExit('EXPECTED_OLD_TAIL_NOT_FOUND')
          p.write_text(s.replace(old, new, 1))
      - name: Pure Sila residual gate
        shell: bash
        run: |
          set -o pipefail
          if grep -RInE --exclude-dir=.git --exclude='bun.lockb' '(ethereum/eip-review-bot|\beip-review-bot\b|\bEIP Review Bot\b)' .; then
            echo 'ACTIONABLE_IDENTITY_RESIDUAL_COUNT=NONZERO'
            exit 1
          fi
          echo 'ACTIONABLE_IDENTITY_RESIDUAL_COUNT=0'
      - name: Install
        run: bun install --frozen-lockfile
      - name: Build
        run: bun run build
      - name: Test
        run: bun run test
      - name: Publish generated branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm .github/workflows/latest-sip-review-bot-sync.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/action.ts
          git rm --cached .github/workflows/latest-sip-review-bot-sync.yml || true
          git commit -m 'sync: latest EIP Review Bot authority 4d5a3c26'
          git push --force origin HEAD:refs/heads/sila/generated-eip-review-bot-4d5a3c26
